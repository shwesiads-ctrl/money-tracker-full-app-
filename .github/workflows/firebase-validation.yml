name: Verify Firebase Spark JSON configuration
on:
  push:
    branches: [main]
    paths:
      - 'firebase/**'
      - 'windows/src/cloud.ts'
      - 'windows/tests/**'
      - '.github/workflows/firebase-spark-check.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate no server functions in Spark config
        run: |
          node -e "const x=require('./firebase/firebase.json');if(x.functions||x.storage)throw Error('Billing-gated services must not deploy');"
          test ! -d firebase/functions
      - name: Windows JSON/QR security tests
        working-directory: windows
        run: npm test
