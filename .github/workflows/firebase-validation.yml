name: Validate Money Tracker Firebase Functions
on:
  push:
    branches: [main]
    paths: ['firebase/**', '.github/workflows/firebase-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: firebase/functions
        run: npm install --no-audit --no-fund
      - name: Compile cloud functions
        working-directory: firebase/functions
        run: npm run build
      - name: Static security tests
        working-directory: firebase/functions
        run: npm test
      - name: Verify no public Firestore access
        run: |
          grep -q "request.auth.uid == uid" firebase/firestore.rules
          grep -q "allow read, write: if false" firebase/firestore.rules
