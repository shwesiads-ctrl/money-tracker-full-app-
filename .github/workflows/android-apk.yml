name: Build Money Tracker Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compile and upload testing APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        working-directory: android
        run: npm install --no-audit --no-fund
      - name: TypeScript core tests
        working-directory: android
        run: npm run test:core
      - name: TypeScript typecheck
        working-directory: android
        run: npm run typecheck
      - name: Expo prebuild
        working-directory: android
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone APK (temporary testing signature)
        working-directory: android/android
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon
      # GitHub Actions artifact quota is exhausted; releases use separate storage.
      # Repository is PRIVATE: release assets require an authorized GitHub account.
      - name: Publish APK as private prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find android/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -s "$apk"
          cp "$apk" Money_Tracker_Android_v2.4.apk
          if gh release view v2.4.0 >/dev/null 2>&1; then
            gh release upload v2.4.0 Money_Tracker_Android_v2.4.apk --clobber
          else
            gh release create v2.4.0 Money_Tracker_Android_v2.4.apk \
              --target "$GITHUB_SHA" \
              --title "Money Tracker Android v2.4.0 (Testing APK)" \
              --notes "Android Back-key OK/Cancel exit confirmation and local SQLite pull-to-refresh. Testing only; back up financial data before updating." \
              --prerelease
          fi
