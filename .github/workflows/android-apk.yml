name: Build Money Tracker Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Compile and upload testing APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        working-directory: android
        run: npm install --no-audit --no-fund
      - name: TypeScript core tests
        working-directory: android
        run: npm run test:core
      - name: TypeScript typecheck
        working-directory: android
        run: npm run typecheck
      - name: Expo prebuild
        working-directory: android
        run: npx expo prebuild --platform android --no-install
      - name: Verify Android widget receiver registration
        working-directory: android
        run: |
          set -euo pipefail
          manifest=android/app/src/main/AndroidManifest.xml
          test -f "$manifest"
          # Presence of the APPWIDGET_UPDATE receiver is mandatory; a successful Gradle
          # build alone does not guarantee the widget is discoverable by launchers.
          grep -q 'android.appwidget.action.APPWIDGET_UPDATE' "$manifest"
          grep -q 'android.appwidget.provider' "$manifest"
          test "$(grep -c 'android.appwidget.action.APPWIDGET_UPDATE' "$manifest")" -ge 2
          echo 'PASS: Native Android manifest includes an AppWidgetProvider receiver'
      - name: Verify both widget variants and privacy defaults
        working-directory: android
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const config=require('./app.json');
          const widgets=config.expo.plugins.find(p=>Array.isArray(p)&&p[0]==='expo-widgets')[1].widgets;
          if(widgets.length!==2)throw Error('Expected two Android widget sizes');
          for(const w of widgets){
            if(!fs.existsSync('android/../'+w.android.initialLayout.slice(2)))throw Error('Missing widget initial layout: '+w.name);
            const code=fs.readFileSync(w.android.initialLayout.slice(2),'utf8');
            if(!code.includes("isPrivate:true"))throw Error('Missing privacy-first widget state: '+w.name);
            if(!code.includes("background('#112235')"))throw Error('Missing widget card background: '+w.name);
          }
          console.log('PASS: two dark theme widgets with privacy-first initial layout');
          NODE
      - name: Verify no obsolete UI footer copy
        working-directory: android
        run: |
          set -euo pipefail
          ! grep -Fq 'Money Tracker v2.5 · TypeScript · Expo SQLite · Offline' src/Tracker.tsx
          ! grep -Fq 'Offline • Secure local sign-in • Android' src/SecureSession.tsx
      - name: Build standalone APK (temporary testing signature)
        working-directory: android/android
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon
      # The previous Actions artifact upload hit the repository storage quota.
      - name: Publish APK as private prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find android/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -1)"
          test -s "$apk"
          cp "$apk" Money_Tracker_Android_v2.6.0_Cloud_Preview.apk
          if gh release view v2.6.0-cloud-preview >/dev/null 2>&1; then
            gh release upload v2.6.0-cloud-preview Money_Tracker_Android_v2.6.0_Cloud_Preview.apk --clobber
          else
            gh release create v2.6.0-cloud-preview Money_Tracker_Android_v2.6.0_Cloud_Preview.apk \
              --target "$GITHUB_SHA" \
              --title "Money Tracker Android v2.6.0 Cloud Preview (Testing APK)" \
              --notes "Money Tracker v2.6.0-cloud-preview Widget UI redesign: dark card, compact 2x2 and medium 4x2 widget, balance typography, monthly income/expenses and privacy-first defaults. Keep data backups. Physical Android launcher QA pending." \
              --prerelease
          fi
