name: Build Money Tracker Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compile and upload testing APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install dependencies
        working-directory: android
        run: npm install --no-audit --no-fund
      - name: TypeScript core tests
        working-directory: android
        run: npm run test:core
      - name: TypeScript typecheck
        working-directory: android
        run: npm run typecheck
      - name: Expo prebuild
        working-directory: android
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone APK (temporary testing signature)
        working-directory: android/android
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: money-tracker-android-testing-apk
          path: android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
